# Pruebas en cada PR; en main y en etiquetas v* además construye y publica la imagen en GHCR.
#   ghcr.io/<dueño>/k2-dashboard:latest   (rama main)
#   ghcr.io/<dueño>/k2-dashboard:1.2.3    (etiqueta v1.2.3)
#   ghcr.io/<dueño>/k2-dashboard:sha-xxxx (cada commit)
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR exige el nombre en minúsculas.
      - name: Nombre de la imagen
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=K2 Dashboard
            org.opencontainers.image.description=Panel web para impresoras Creality K2 (Klipper + Moonraker)

      # Prueba real del contenedor antes de publicar: arranca, responde en su puerto y crea los datos.
      - name: Construir para la prueba (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: k2-dashboard:prueba
          cache-from: type=gha

      - name: Probar el contenedor
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/k2-data"
          docker run -d --name k2 -p 9123:9123 -e PORT=9123 -e PRINTER_HOST=192.0.2.1 -v "$RUNNER_TEMP/k2-data:/data" k2-dashboard:prueba
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' k2)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' k2 | grep -qx healthy
          curl -fsS http://127.0.0.1:9123/auth/health
          # Primer arranque: la página de login responde (desde la "red local" del runner)
          curl -fsS -o /dev/null http://127.0.0.1:9123/login
          # Sin sesión, la app redirige al login
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9123/)" = 302
          # Se crearon los datos en el volumen
          sudo ls -la "$RUNNER_TEMP/k2-data"
          for f in users.json settings.json secrets.json devices.json storage; do sudo test -e "$RUNNER_TEMP/k2-data/$f"; done
          sudo grep -q '"printerHost": "192.0.2.1"' "$RUNNER_TEMP/k2-data/settings.json"

      - name: Registros del contenedor
        if: always()
        run: docker logs k2 2>&1 | tail -50 || true

      # En los PR solo se construye (para comprobar que funciona); no se publica.
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
