services:
  k2-dashboard:
    image: ghcr.io/nye69/k2-dashboard:latest
    # Para construir la imagen en el propio servidor en vez de bajarla: comenta "image" y descomenta "build".
    # build: .
    container_name: k2-dashboard
    restart: unless-stopped
    init: true
    # El contenedor escucha en PORT (por defecto 8095): mismo puerto dentro y fuera.
    ports:
      - "${PORT:-8095}:${PORT:-8095}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8095}
    volumes:
      # Datos persistentes: usuario, ajustes, claves y dispositivos (ver docs/instalacion.md#rutas).
      # Sin esta línea se pierden al recrear el contenedor.
      - ${DATA_PATH:-./data}:/data
