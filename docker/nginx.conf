# K2 Dashboard: sirve la app y reenvía la API de Moonraker a la impresora.
# Todo exige sesión iniciada (lo decide el servidor Node en /auth/check), salvo el login,
# la configuración inicial y lo necesario para verse e instalarse como app.
#
# La IP de la impresora y los proxies de confianza se cambian desde Ajustes en la app:
# el servidor Node reescribe /run/k2/*.conf y recarga nginx.

upstream dashboard {
    server 127.0.0.1:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # $k2_host (impresora) y set_real_ip_from (proxies de confianza)
    include /run/k2/*.conf;
    # Por si la impresora se configura con un nombre en vez de una IP (DNS de Docker).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 3s;

    # Redirecciones relativas ("/login"), para no perder el puerto ni el dominio público.
    absolute_redirect off;

    # G-code grandes
    client_max_body_size 1g;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Cada petición pregunta al servidor si la cookie es válida.
    auth_request /auth/check;

    location = /auth/check {
        internal;
        proxy_pass http://dashboard/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Login, configuración inicial y API de ajustes. El servidor necesita saber de dónde viene
    # la petición para permitir admin/changeme solo desde la red local.
    location ~ ^/(login|setup)$ {
        auth_request off;
        proxy_pass http://dashboard;
        proxy_set_header Host $http_host;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Peer-IP $realip_remote_addr;
        proxy_set_header X-Had-Forward "$http_x_forwarded_for$http_x_real_ip";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /auth/ {
        auth_request off;
        proxy_pass http://dashboard;
        proxy_set_header Host $http_host;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Peer-IP $realip_remote_addr;
        proxy_set_header X-Had-Forward "$http_x_forwarded_for$http_x_real_ip";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /websocket {
        proxy_pass http://$k2_host:7125/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Moonraker compara Origin con Host: se conserva el Host del navegador.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1d;
    }

    # Websocket propio de Creality: de aquí sale el tiempo restante que calcula la impresora.
    location = /k2ws {
        proxy_pass http://$k2_host:9999/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $k2_host:9999;
        proxy_set_header Origin http://$k2_host;
        proxy_read_timeout 1d;
    }

    location ~ ^/(server|printer|machine|access|api)/ {
        proxy_pass http://$k2_host:7125;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }

    # Públicos: manifiesto e iconos (para instalar la app y la pantalla de login).
    location = /manifest.webmanifest {
        auth_request off;
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache";
    }

    location /icons/ {
        auth_request off;
        expires 7d;
    }

    # iOS y algunos navegadores piden el icono en la raíz, a veces sin cookie: siempre público.
    location ~ ^/apple-touch-icon(-precomposed)?(-\d+x\d+)?\.png$ {
        auth_request off;
        try_files /icons/apple-touch-icon.png =404;
        expires 7d;
    }

    location = /favicon.ico {
        auth_request off;
        try_files /icons/favicon-64.png =404;
        default_type image/png;
        types { }
        expires 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desactiva cualquier service worker viejo que haya quedado en el dominio.
    location = /sw.js {
        auth_request off;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
    }

    # Sin sesión, las páginas llevan al login.
    location / {
        error_page 401 = @login;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location @login {
        return 302 /login;
    }
}
