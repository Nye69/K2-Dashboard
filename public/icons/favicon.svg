<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2539"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="124" x2="0" y2="388">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
    <g transform="translate(256 256) scale(1.1) translate(-256 -258)">
      <!-- soft glow behind the print -->
      <ellipse cx="256" cy="318" rx="118" ry="70" fill="url(#glow)"/>
      <!-- frame -->
      <rect x="132" y="124" width="248" height="264" rx="30" fill="none" stroke="url(#metal)" stroke-width="22"/>
      <!-- gantry -->
      <line x1="140" y1="196" x2="372" y2="196" stroke="url(#metal)" stroke-width="16" stroke-linecap="round"/>
      <!-- bed -->
      <line x1="170" y1="352" x2="342" y2="352" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
      <!-- print layers -->
      <g fill="url(#green)">
        <rect x="186" y="320" width="140" height="18" rx="9"/>
        <rect x="200" y="298" width="112" height="18" rx="9"/>
        <rect x="214" y="276" width="84"  height="18" rx="9"/>
      </g>
      <!-- hotend -->
      <rect x="224" y="176" width="64" height="58" rx="12" fill="#e2e8f0"/>
      <path d="M240 234 H272 L259 254 Q256 259 253 254 Z" fill="#f97316"/>
    </g>
</svg>
